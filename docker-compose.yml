services:
  db:
    image: postgres:16-alpine
    container_name: upnext_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password}
      POSTGRES_DB: ${POSTGRES_DB:-upnext_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-upnext_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - upnext_network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: upnext_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_password}@db:5432/${POSTGRES_DB:-upnext_db}?schema=public
      JWT_SECRET: ${JWT_SECRET:-upnext_jwt_secret_key_demo}
      SUPERUSER_SECRET: ${SUPERUSER_SECRET:-upnext_superuser_key_demo}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      CLOUD_NAME: ${CLOUD_NAME:-dvaszkgf7}
      API_KEY: ${API_KEY:-119763799666852}
      API_SECRET: ${API_SECRET:-WhCK50tWPq_8PHQN9bXxftbwMDs}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - upnext_network

volumes:
  postgres_data:
    driver: local

networks:
  upnext_network:
    driver: bridge
