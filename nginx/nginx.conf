user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'upstream: $upstream_addr';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # Gzip Compression for JSON and text payloads
    gzip on;
    gzip_types application/json text/plain text/css application/javascript application/x-javascript;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;

    # Rate Limiting: 5 requests per second per IP
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=5r/s;
    limit_req_status 429;

    # Upstream configuration with shared memory zone
    upstream backend_cluster {
        zone backend_cluster 64k;
        server backend:5000;
    }

    server {
        listen 80;
        server_name localhost;

        # Security header (default)
        add_header X-Content-Type-Options "nosniff" always;

        location /api/ {
            limit_req zone=api_limit burst=2 nodelay;

            proxy_pass http://backend_cluster/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Upstream and Security headers
            add_header X-Upstream $upstream_addr always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # Redirect /api to /api/
        location = /api {
            return 301 /api/;
        }
    }
}

